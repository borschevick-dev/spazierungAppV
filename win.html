<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>huh?</title>

    <link rel="stylesheet" href="./styles.css">

    <!-- ШРИФТ -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url("images/foresttt.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Rubik', sans-serif;
        }

        .container {
            width: 100%;
            text-align: center;
        }

        .title {
    position: relative;

    --x: -20px;
    --y: -245px;

    transform: translate(var(--x), var(--y));

    color: white;
    font-size: 77px;
    font-weight: 700;

    /* 🧠 КОНТРАСТ ДЛЯ СВЕТЛОГО ФОНА */
    padding: 10px 25px;
    display: inline-block;


    /* ✨ НЕОН */
    text-shadow:
        0 0 8px rgba(255,255,255,0.9),
        0 0 20px rgba(255,105,180,0.8),
        0 0 45px rgba(255,0,150,0.6),
        0 20px 60px rgba(0,0,0,0.6);
}
    </style>
</head>

<body>
    <img src="images/soy1.png" class="img1">
    <img src="images/soy2.png" class="img2">
    <div class="container">

        <div class="title">
            Юхууууууууууууууууууу!!!<br>
            Новый рекорд по шагам!
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
