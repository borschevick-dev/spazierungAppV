<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>huh?</title>

    <link rel="stylesheet" href="./styles.css">

    <!-- ШРИФТ -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">

    <style>

        html, body {
            margin: 0;
            overflow: hidden; /* убирает прокрутку */
        }

        body {
            background-image: url("images/foresttt.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Rubik', sans-serif;
        }

        .container {
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* ===== ТЕКСТ ===== */
        .title {
            position: relative;

            --x: -20px;
            --y: -245px;

            transform: translate(var(--x), var(--y));

            color: white;
            font-size: 77px;
            font-weight: 700;

            padding: 10px 25px;
            display: inline-block;

            text-shadow:
                0 0 8px rgba(255,255,255,0.9),
                0 0 20px rgba(255,105,180,0.8),
                0 0 45px rgba(255,0,150,0.6),
                0 20px 60px rgba(0,0,0,0.6);
        }

        /* ===== ЛЕВАЯ КАРТИНКА ===== */
        .img1 {
            position: fixed;

            left: 700px;
            top: 0;

            width: 1120px;

            z-index: 5;

            animation: float1 4s ease-in-out infinite;
        }

        /* ===== ПРАВАЯ КАРТИНКА ===== */
        .img2 {
            position: fixed;

            right: 0px;
            bottom: 350000px;

            width: 1120px;

            z-index: 5;

            animation: float2 5s ease-in-out infinite;
        }

        /* ===== АНИМАЦИИ ===== */

        @keyframes float1 {
            0% {
                transform: translateY(0px) rotate(-1deg);
            }

            50% {
                transform: translateY(-10px) rotate(1deg);
            }

            100% {
                transform: translateY(0px) rotate(-1deg);
            }
        }

        @keyframes float2 {
            0% {
                transform: translateY(0px) rotate(1deg);
            }

            50% {
                transform: translateY(-12px) rotate(-1deg);
            }

            100% {
                transform: translateY(0px) rotate(1deg);
            }
        }

    </style>
</head>

<body>

    <!-- КАРТИНКИ -->
    <img src="images/soy1.png" class="img1">
    <img src="images/soy2.png" class="img2">

    <!-- ТЕКСТ -->
    <div class="container">

        <div class="title">
            Юхууууууууууууууууууу!!!<br>
            Новый рекорд по шагам!
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
