<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<title>huh?</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    overflow: hidden;
}

body {
    background-image: url("images/forestttU.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Rubik', sans-serif;
}

/* ТЕКСТ (СТАБИЛЬНЫЙ) */

.title {
    --x: -20px;
    --y: -245px;

    color: white;
    font-size: 77px;
    font-weight: 700;

    display: inline-block;
    padding: 10px 25px;

    text-shadow:
        0 0 8px rgba(255,255,255,0.9),
        0 0 20px rgba(255,105,180,0.8),
        0 0 45px rgba(255,0,150,0.6),
        0 20px 60px rgba(0,0,0,0.6);

    position: relative;

    animation: floatText 4s ease-in-out infinite;

    transform: translate(var(--x), var(--y));
}

/* ВАЖНО: анимация ТОЛЬКО Y */
@keyframes floatText {
    0%, 100% {
        transform: translate(var(--x), calc(var(--y) + 0px));
    }
    50% {
        transform: translate(var(--x), calc(var(--y) - 10px));
    }
}

/* КАРТИНКИ */

.img1, .img2 {
    position: fixed;
    bottom: 0;

    width: min(64vw, 1640px);
}

/* ЛЕВАЯ */
.img1 {
    left: 0;

    --x: 650px;
    --y: 10px;

    transform: translate(var(--x), var(--y));

    animation: float1 4s ease-in-out infinite;
}

/* ПРАВАЯ */
.img2 {
    right: 0;

    --x: -650px;
    --y: 20px;

    transform: translate(var(--x), var(--y));

    animation: float2 5s ease-in-out infinite;
}

/* АНИМАЦИИ — ТОЛЬКО транселейт у */

@keyframes float1 {
    0%, 100% {
        transform: translate(var(--x), var(--y)) rotate(-1deg);
    }
    50% {
        transform: translate(var(--x), calc(var(--y) - 10px)) rotate(1deg);
    }
}

@keyframes float2 {
    0%, 100% {
        transform: translate(var(--x), var(--y)) rotate(1deg);
    }
    50% {
        transform: translate(var(--x), calc(var(--y) - 12px)) rotate(-1deg);
    }
}

</style>
</head>

<body>

<img src="images/soy1.png" class="img1">
<img src="images/soy2.png" class="img2">

<div class="title">
    Юхууууууууууууууууууу!!!<br>
    Новый рекорд по шагам!
</div>

</body>
</html>
