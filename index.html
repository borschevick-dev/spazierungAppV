<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Варя</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&family=Pacifico&family=Caveat:wght@400;700&family=Lobster&family=Comfortaa:wght@400;700&family=Alumni+Sans:wght@400;700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&family=Days+One&family=Stick&family=Noto+Serif+Display:wght@400;700&family=Monomakh&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    min-height: 3000px; /* меняем с 3000px на 100vh, чтобы кнопка была видна */
    background: linear-gradient(
    to bottom,
    white 0%,
    #ffe6f0 4%,
    #ffc0d6 12%,
    #ff9fbe 25%,
    #ff6f9f 40%,
    #ff4f93 60%,
    #ff2f7a 90%
);
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
}

.text {
    font-family: 'Rubik', sans-serif;
    font-size: 120px;
    line-height: 0.95;
    text-align: center;
    font-weight: 700;
    max-width: 100vw;
    overflow-wrap: anywhere;
    word-break: break-word;
    flex: 1; /* толкает кнопку вниз */
    padding: 40px 20px;
}

/* ========== СТИЛИ ДЛЯ КНОПКИ (ДОБАВЛЕНО) ========== */
.page-end {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 60px 0;
    margin-top: auto; /* вместо фиксированного margin-top, прижимает к низу */
    opacity: 0;
    transform: translateY(100%);
    animation: slideUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
    animation-delay: 0.5s;
}

.next-btn {
    padding: 30px 52px;
    font-size: 36px;
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    border-radius: 999px;
    background: white;
    color: #ff4f93;
    text-decoration: none;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.next-btn:hover {
    transform: scale(1.25);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

@keyframes slideUp {
    0% {
        opacity: 0;
        transform: translateY(100%);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}
/* ============================================= */

/* шрифты */
.pacifico { font-family: 'Pacifico', cursive; }
.lobster  { font-family: 'Lobster', cursive; }
.alumni   { font-family: 'Alumni Sans', sans-serif; }
.playfair { font-family: 'Playfair Display', serif; }
.mont     { font-family: 'Montserrat', sans-serif; font-weight: 700; }
.daysone  { font-family: 'Days One', sans-serif; }
.sensation{ font-family: Arial, sans-serif; }
.noto     { font-family: 'Noto Serif Display', serif; }
.monomakh { font-family: 'Monomakh', serif; }
.press {font-family: 'Press Start 2P', cursive;}
.pixel {font-family: 'Pixelify Sans', sans-serif;}
.serif {font-family: 'Libertinus Serif', serif;}

</style>
</head>

<body>

<div class="text" id="text"></div>
<div class="page-end">
  <a href="home.html" class="next-btn">дальше</a>
</div>

<script>
const baseText =
"ВааааааааааааааааааааАааааааааааааааааАаааааааааааааааааааааааааааАаааааааааааааааааааааааАааааааааааааааааааааааааааааАааааааааааааааааааааааааааааааааааааАаааааааааааааааааааАааааааааааааааааааааааааааааааааааааааАааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааааАааааааааааааааАааааааааааааааааааааааааАааааааааааааааааааааааааааааааааааааааааааааааааааааааааааАааааааааааааааааааааааааааааааааааааааааааааааааааааааааааАааааааааааааааааааааааааааааааааааааааааАаааааааааааааааааааааааааааааааАааааааааааааааааааааааааааааааааааааАааааааааря!";

const fonts = [
  "press",
  "pixel",
  "serif",
  "pacifico",
  "caveat",
  "lobster",
  "alumni",
  "playfair",
  "mont",
  "daysone",
  "noto",
  "monomakh"
];

let result = "";
let cooldown = 0;

for (let char of baseText) {
    if (char === "а") {
        if (cooldown > 0) {
            result += "а";
            cooldown--;
            continue;
        }

        if (Math.random() < 0.6) {
            const style = fonts[Math.floor(Math.random() * fonts.length)];
            const len = 1;

            result += `<span class="${style}">` + "а".repeat(len) + "</span>";

            cooldown = 2 + Math.floor(Math.random() * 3);
        } else {
            result += "а";
        }
    } else {
        result += char;
    }
}
document.getElementById("text").innerHTML = result;
</script>

</body>
</html>
