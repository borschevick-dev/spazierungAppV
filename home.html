<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>huh?</title>

    <link rel="stylesheet" href="./styles.css">

    <!-- ШРИФТ -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url("images/krasavchik.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Rubik', sans-serif;
        }

        .container {
            width: 100%;
            text-align: center;
        }



.title {
    position: relative;
    display: inline-block;
    top: -200px;
    left: center;
    font-size: 70px;
    font-weight: 800;
    color: white;
    text-align: center;

    padding: 7px 20px;
    z-index: 1;
}

/* 🌸 ОВАЛЬНАЯ РОЗОВАЯ ДЫМКА */
.title::before {
    content: "";
    position: absolute;

    /* 🔥 ОВАЛ (шире чем высота) */
    width: 1100px;
    height: 420px;

    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(1.1);

    z-index: -2;

    background: radial-gradient(
        ellipse,
        rgba(255, 80, 170, 0.45) 0%,
        rgba(255, 80, 170, 0.25) 40%,
        rgba(255, 80, 170, 0.08) 65%,
        transparent 85%
    );

    filter: blur(55px);
}

/* 🪟 СТЕКЛЯННАЯ ПОДЛОЖКА */
.title::after {
    content: "";
    position: absolute;

    /* 📦 МЕНЬШЕ ВЫСОТА */
    inset: -100px -120px -60px -120px;
    z-index: -1;

    border-radius: 10px;

    /* 🪟 ОСНОВНОЕ СТЕКЛО */
    background: rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    /* 🌫 ГРАДИЕНТ — СИЛЬНЕЕ В ЦЕНТРЕ */
    mask-image: radial-gradient(
        ellipse at center,
        rgba(0,0,0,1) 10%,
        rgba(0,0,0,0.9) 30%,
        rgba(0,0,0,0.5) 55%,
        rgba(0,0,0,0.2) 87%,
        transparent 100%
    );

    -webkit-mask-image: radial-gradient(
        ellipse at center,
        rgba(0,0,0,1) 10%,
        rgba(0,0,0,0.9) 30%,
        rgba(0,0,0,0.5) 55%,
        rgba(0,0,0,0.2) 75%,
        transparent 100%
    );
}
        .buttons-container {
            position: relative;

            width: 100%;
            height: 200px;
        }

        .button {
            position: absolute;

            padding: 18px 42px;

            font-size: 28px;
            font-weight: 700;

            border: none;
            border-radius: 16px;

            cursor: pointer;

            background: white;
            color: #ff4f93;

            transition: 0.25s ease;
        }

        .button:hover {
            transform: scale(1.12);
        }

        /* КНОПКА ДА */
        #yes-button {
            left: 735px;
            top: 193px;
            background: #0ddb78;
            color: white;
        }

        /* КНОПКА НЕТ */
        #no-button {
            left: 55%;
            top: 69%;
            background: #d41528;
            color: white;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            Ты пойдешь со мной гулять?
        </div>

        <div class="buttons-container">

            <!-- ДА -->
            <button class="button"
                id="yes-button"
                onclick="location.href='win.html'">

                Да

            </button>

            <!-- НЕТ -->
            <button class="button" id="no-button">

                Нет

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
