<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>huh?</title>

    <link rel="stylesheet" href="./styles.css">

    <!-- ШРИФТ -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url("images/krasavchik.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Rubik', sans-serif;
        }

        .container {
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 60px;
            color: white;

            font-weight: 700;

            margin-bottom: 400px;

            text-shadow:
        -5px -5px 0 black,
         5px -5px 0 black,
        -5px  5px 0 black,
         5px  5px 0 black,
         0px  5px 0 black,
         5px  0px 0 black,
        -5px  0px 0 black,
         0px -5px 0 black;
        }

        .buttons-container {
            position: relative;

            width: 100%;
            height: 200px;
        }

        .button {
            position: absolute;

            padding: 18px 42px;

            font-size: 28px;
            font-weight: 700;

            border: none;
            border-radius: 16px;

            cursor: pointer;

            background: white;
            color: #ff4f93;

            transition: 0.25s ease;
        }

        .button:hover {
            transform: scale(1.12);
        }

        /* КНОПКА ДА */
        #yes-button {
            left: 40%;
            top: 20%;
            background: #0ddb78;
            color: white;
        }

        /* КНОПКА НЕТ */
        #no-button {
            left: 55%;
            top: 70%;
            background: #d41528;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            Ты пойдешь со мной гулять?
        </div>

        <div class="buttons-container">

            <!-- ДА -->
            <button class="button"
                id="yes-button"
                onclick="location.href='win.html'">

                Да

            </button>

            <!-- НЕТ -->
            <button class="button" id="no-button">

                Нет

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
